# /docker-compose.yml (LENGKAP DAN SUDAH DIPERBARUI)

services:
  # --- 1. FRONTEND SERVICE (UI) ---
  frontend-ui:
    build: ./frontend-ui
    container_name: web_ui
    ports:
      - "80:80"
    networks:
      - resep-net
    depends_on:
      - service-users
      - service-recipes
      - service-interactions

  # --- 2. USER SERVICE (BACKEND API) ---
  service-users:
    build: ./service-users
    container_name: api_users
    ports:
      - "3001:3000"
    networks:
      - resep-net
    depends_on:
      - mongo-db

  # --- 3. RECIPE SERVICE (BACKEND API) ---
  service-recipes:
    build: ./service-recipes
    container_name: api_recipes
    ports:
      - "3002:3000"
    networks:
      - resep-net
    depends_on:
      - mongo-db

  # --- 4. INTERACTION SERVICE (BACKEND API) ---
  service-interactions:
    build: ./service-interactions
    container_name: api_interactions
    ports:
      - "3003:3000"
    networks:
      - resep-net
    depends_on:
      - mongo-db

  # --- 5. UPLOAD SERVICE (BACKEND API) - BARU! ---
  service-upload:
    build: ./service-upload
    container_name: api_upload
    ports:
      - "3004:3000" # Kita gunakan port 3004
    volumes:
      # Map folder /app/uploads di DALAM container
      # ke 'uploads-data' di LUAR container
      - uploads-data:/app/uploads
    networks:
      - resep-net

  # --- 6. DATABASE SERVICE ---
  mongo-db:
    image: mongo:latest
    container_name: database_resep
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - resep-net

# --- Konfigurasi Volume & Jaringan ---
volumes:
  mongo-data: # Volume untuk data DB
  uploads-data: # Volume BARU untuk file gambar

networks:
  resep-net:
    driver: bridge